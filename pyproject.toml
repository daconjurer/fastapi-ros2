[tool.poetry]
name = "fastapi_ros2"
version = "0.2.0"
description = "A FastAPI based API for ROS2"
authors = ["Victor Sandoval <vs.software.eng@gmail.com>"]

packages = [
    {include = "fastapi_ros2"},
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "^0.162.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
pydantic = {extras = ["email"], version = "^2.12"}
loguru = "^0.7.2"

[tool.poetry.scripts]
print_publisher = "fastapi_ros2.examples.print_publisher:main"
service = "fastapi_ros2.services.add_two_ints.server:main"
client = "fastapi_ros2.services.add_two_ints.client:main"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
httpx2 = "^2.16.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.17.2"
basedpyright = "^1.40.2"

[build-system]
requires = ["poetry-core>=1.3.2"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
# Ruff's classic defaults, so upgrading ruff doesn't change which rules apply.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests", "fastapi_ros2"]
pythonpath = ["."]
# Also run the docstring examples, e.g. wrap_int64's. Import by module path, since
# directories without `__init__.py` would shadow installed packages of the same name.
addopts = "--doctest-modules --import-mode=importlib"

[tool.basedpyright]
include = ["fastapi_ros2", "main.py", "tests"]
typeCheckingMode = "recommended"
# rclpy's create_* calls return entities that are often only needed for their
# side effects, and long log messages are split across implicitly joined strings.
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
