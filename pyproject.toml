[project]
name = "fastapi_ros2"
version = "0.2.0"
description = "A FastAPI based API for ROS2"
authors = [{ name = "Victor Sandoval", email = "vs.software.eng@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic[email]>=2.12,<3",
    "loguru>=0.7.2,<0.8",
]

[dependency-groups]
test = [
    "pytest>=9.1.1,<10",
    "httpx2>=2.16.0,<3",
]
dev = [
    "ruff>=0.17.2,<0.18",
    "basedpyright>=1.40.2,<2",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
# The package is at the root, not under src/. uv installs it in editable mode, so
# the code still runs from the checkout, with its metadata in the venv.
module-root = ""

[tool.ruff.lint]
# Ruff's classic defaults, so upgrading ruff doesn't change which rules apply.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests", "fastapi_ros2"]
pythonpath = ["."]
# Also run the docstring examples, e.g. wrap_int64's. Import by module path, since
# directories without `__init__.py` would shadow installed packages of the same name.
addopts = "--doctest-modules --import-mode=importlib"

[tool.basedpyright]
include = ["fastapi_ros2", "main.py", "tests"]
typeCheckingMode = "recommended"
# rclpy's create_* calls return entities that are often only needed for their
# side effects, and long log messages are split across implicitly joined strings.
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
