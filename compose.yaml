x-ros: &ros
  build: .
  image: fastapi-ros2

# `docker compose watch`: code edits restart the services running our code,
# dependency changes rebuild the image.
x-develop: &develop
  watch:
    - path: ./fastapi_ros2
      target: /app/fastapi_ros2
      action: sync+restart
    - path: ./main.py
      target: /app/main.py
      action: sync+restart
    - path: ./pyproject.toml
      action: rebuild
    - path: ./uv.lock
      action: rebuild

services:
  turtlesim:
    <<: *ros
    # Run the node directly: `ros2 run` exits on SIGTERM without forwarding it,
    # so the node was killed before leaving the ROS graph and stayed "available"
    # to other nodes until its ~20 s discovery lease expired.
    command: /opt/ros/lyrical/lib/turtlesim/turtlesim_node
    environment:
      # No display in the container, so turtlesim renders off-screen.
      QT_QPA_PLATFORM: offscreen

  add_two_ints:
    <<: *ros
    command: python3 -m fastapi_ros2.services.add_two_ints.server
    develop: *develop

  api:
    <<: *ros
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # The API exits when its ROS executor dies; start it again. A manual
    # `docker compose stop` or `down` does not trigger a restart.
    restart: unless-stopped
    # Ready: the node spins and every service the API calls is available (see
    # /health). The image has no curl. Checks run every second until the first
    # pass, so `docker compose up -d --wait` returns once the API can serve.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - turtlesim
      - add_two_ints
    develop: *develop
