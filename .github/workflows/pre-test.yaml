name: Pre-test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # A generic ROS 2 Lyrical image with Poetry, pinned so that rebuilding it
    # never changes CI without a commit here.
    container: ghcr.io/daconjurer/ros2-for-ci:lyrical-82e7dc470d402cb330ea01caaaac88c90cbfda9f
    defaults:
      run:
        # Actions ignores the image's entrypoint, so source ROS through the shell.
        shell: /ros_entrypoint.sh bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install ROS packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-lyrical-example-interfaces ros-lyrical-turtlesim
      - name: Install Python dependencies
        run: poetry install --no-root --no-interaction
      - name: Lint and test
        run: ./scripts/check.sh
