name: Pre-test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t fastapi-ros2 .
      # The image only has the main dependencies; add the dev and test groups.
      - name: Lint and test
        run: docker run --rm fastapi-ros2 bash -c "poetry install --no-root --no-interaction && ./scripts/check.sh"
