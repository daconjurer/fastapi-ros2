name: Pre-test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # A generic ROS 2 Lyrical image with uv, just, and a venv at /opt/venv that sees the
    # system site-packages, pinned so that rebuilding it never changes CI without a commit here.
    container: ghcr.io/daconjurer/ros2-for-ci:lyrical-b20e21592fdb4948082a5dd03a627cca9fe2ebf3
    # Actions ignores the image's entrypoint, so have every bash step source ROS.
    env:
      BASH_ENV: /opt/ros/lyrical/setup.bash
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install ROS packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-lyrical-example-interfaces ros-lyrical-turtlesim
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Lint and test
        run: just check
